name: loc-org

# Reusable org-wide lines-of-code report (tokei) + optional docs refresh.
#
# Called as a job from an org-level workflow (e.g. ktbhealth/.github):
#
#   loc:
#     uses: 9aia/cypera/.github/workflows/loc-org.yml@v0.2.0
#     with:
#       config_ref: git:ktbhealth/.github//packs/loc#main
#     secrets: inherit
#
# Distribution is via tamias, not actions/checkout:
#   - 9aia/tamias/actions/setup-tamias installs the tamias CLI
#     (version pinned by the `tamias_ref` input).
#   - `tamias install git:9aia/cypera#<tool_ref>` installs this repo as a
#     `type: files` pack; tools run from the store payload dir
#     (`tamias info cypera-toolbox --json` → `dir`).
#   - `tamias install <config_ref>` installs the caller org's loc config
#     pack — an org `type: files` config pack containing a
#     `loc.yaml` with keys: org, repos, docs_repo, docs_outputs,
#     docs_branch, pr_base, token_broker_url (docs_* may be omitted to
#     skip the docs job at runtime).
#
# Job `count` clones every repo in `repos`, counts with the shared
# exclude list (cypera.toml inside the installed pack), writes a job
# summary and uploads a loc-results artifact. Job `publish-docs`
# regenerates the metrics pages and opens/updates a PR on docs_branch
# when the config pack provides docs settings and a token source
# (token broker or DOCS_BOT_TOKEN) is available.

on:
  workflow_call:
    inputs:
      config_ref:
        description: >-
          Tamias ref to the org's loc config pack (a `type: files` pack
          containing `loc.yaml`), e.g.
          `git:ktbhealth/.github//packs/loc#main`
        required: true
        type: string
      tool_ref:
        description: Semver tag of 9aia/cypera to install tools/loc from
        required: false
        type: string
        default: v0.2.2
      tamias_ref:
        description: Semver tag of 9aia/tamias used by the setup-tamias action
        required: false
        type: string
        default: v0.1.5
    secrets:
      DOCS_BOT_TOKEN:
        description: PAT/App token with contents+pull-requests write on docs_repo (fallback when token_broker_url is unset)
        required: false
      TOKEN_MINT_SECRET:
        description: Bearer secret for the token broker (used with token_broker_url)
        required: false
      LOC_READ_TOKEN:
        description: PAT with read access to private repos in `repos`
        required: false

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: 9aia/tamias/actions/setup-tamias@v0.1.5
        with:
          ref: ${{ inputs.tamias_ref }}
      - name: Install cypera tools
        env:
          TOOL_REF: ${{ inputs.tool_ref }}
        run: |
          tamias install "git:9aia/cypera#${TOOL_REF}"
          echo "CYPERA_DIR=$(tamias info cypera-toolbox --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["dir"])')" >> "$GITHUB_ENV"
      - name: Install org loc config
        env:
          CONFIG_REF: ${{ inputs.config_ref }}
        run: |
          tamias install "${CONFIG_REF}"
          LOC_CONFIG_DIR=$(tamias list --json | python3 -c '
          import json, os, sys
          ref = os.environ["CONFIG_REF"]
          pkgs = json.load(sys.stdin)["packages"]
          match = [p for p in pkgs if p.get("source_ref") == ref]
          if not match:
              sys.exit(f"no installed package with source_ref {ref!r}")
          print(match[-1]["dir"])
          ')
          echo "LOC_CONFIG_DIR=${LOC_CONFIG_DIR}" >> "$GITHUB_ENV"
      - name: Parse loc config
        run: |
          python3 - <<'EOF' >> "$GITHUB_ENV"
          import os
          import pathlib
          import subprocess
          import sys

          try:
              import yaml
          except ModuleNotFoundError:
              subprocess.run(
                  [sys.executable, "-m", "pip", "install", "--quiet", "pyyaml"],
                  check=True,
              )
              import yaml

          cfg = (
              yaml.safe_load(
                  pathlib.Path(os.environ["LOC_CONFIG_DIR"], "loc.yaml").read_text()
              )
              or {}
          )
          for key in (
              "org",
              "repos",
              "docs_repo",
              "docs_outputs",
              "docs_branch",
              "pr_base",
              "token_broker_url",
          ):
              value = cfg.get(key, cfg.get(key.upper()))
              if value is None:
                  continue
              if isinstance(value, list):
                  value = "\n".join(str(item) for item in value)
              print(f"{key.upper()}<<__LOC_EOF__\n{value}\n__LOC_EOF__")
          EOF
      - name: Read cypera config
        run: |
          cd "$CYPERA_DIR"
          python3 - <<'EOF' >> "$GITHUB_ENV"
          import pathlib
          import tomllib

          cfg = tomllib.loads(pathlib.Path("cypera.toml").read_text())
          print(f"TOKEI_VERSION={cfg['loc']['tokei_version']}")
          EOF
      - name: Install tokei
        run: |
          curl -fsSL "https://github.com/XAMPPRocky/tokei/releases/download/${TOKEI_VERSION}/tokei-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/tokei.tar.gz
          tar -xzf /tmp/tokei.tar.gz -C /tmp tokei
          sudo install -m 0755 /tmp/tokei /usr/local/bin/tokei
      - name: Count lines of code
        env:
          LOC_READ_TOKEN: ${{ secrets.LOC_READ_TOKEN }}
          OUT: ${{ github.workspace }}/loc-results
        run: bash "$CYPERA_DIR/tools/loc/count-loc.sh"
      - name: Summarize
        run: python3 "$CYPERA_DIR/tools/loc/summarize-loc.py" loc-results "$ORG" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: loc-results
          path: loc-results/*.json
          retention-days: 90

  publish-docs:
    needs: count
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOCS_BOT_TOKEN: ${{ secrets.DOCS_BOT_TOKEN }}
      TOKEN_MINT_SECRET: ${{ secrets.TOKEN_MINT_SECRET }}
    steps:
      - uses: 9aia/tamias/actions/setup-tamias@v0.1.5
        with:
          ref: ${{ inputs.tamias_ref }}
      - name: Install org loc config
        env:
          CONFIG_REF: ${{ inputs.config_ref }}
        run: |
          tamias install "${CONFIG_REF}"
          LOC_CONFIG_DIR=$(tamias list --json | python3 -c '
          import json, os, sys
          ref = os.environ["CONFIG_REF"]
          pkgs = json.load(sys.stdin)["packages"]
          match = [p for p in pkgs if p.get("source_ref") == ref]
          if not match:
              sys.exit(f"no installed package with source_ref {ref!r}")
          print(match[-1]["dir"])
          ')
          echo "LOC_CONFIG_DIR=${LOC_CONFIG_DIR}" >> "$GITHUB_ENV"
      - name: Parse loc config
        run: |
          python3 - <<'EOF' >> "$GITHUB_ENV"
          import os
          import pathlib
          import subprocess
          import sys

          try:
              import yaml
          except ModuleNotFoundError:
              subprocess.run(
                  [sys.executable, "-m", "pip", "install", "--quiet", "pyyaml"],
                  check=True,
              )
              import yaml

          cfg = (
              yaml.safe_load(
                  pathlib.Path(os.environ["LOC_CONFIG_DIR"], "loc.yaml").read_text()
              )
              or {}
          )
          for key in (
              "org",
              "repos",
              "docs_repo",
              "docs_outputs",
              "docs_branch",
              "pr_base",
              "token_broker_url",
          ):
              value = cfg.get(key, cfg.get(key.upper()))
              if value is None:
                  continue
              if isinstance(value, list):
                  value = "\n".join(str(item) for item in value)
              print(f"{key.upper()}<<__LOC_EOF__\n{value}\n__LOC_EOF__")
          EOF
      - name: Install cypera tools
        env:
          TOOL_REF: ${{ inputs.tool_ref }}
        run: |
          tamias install "git:9aia/cypera#${TOOL_REF}"
          echo "CYPERA_DIR=$(tamias info cypera-toolbox --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["dir"])')" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v7
        with:
          name: loc-results
          path: loc-results
      - name: Regenerate docs pages
        run: |
          if [ -z "${DOCS_REPO:-}" ] || [ -z "${DOCS_OUTPUTS:-}" ]; then
            echo "::notice::loc.yaml provides no docs_repo/docs_outputs — skipping docs update"
            exit 0
          fi
          # Prefer the token broker (short-lived app installation token);
          # fall back to a static DOCS_BOT_TOKEN when no broker is set.
          if [ -n "${TOKEN_BROKER_URL:-}" ] && [ -n "${TOKEN_MINT_SECRET:-}" ]; then
            repo_name="${DOCS_REPO##*/}"
            BOT_TOKEN=$(curl -fsS -X POST "${TOKEN_BROKER_URL}/token" \
              -H "Authorization: Bearer ${TOKEN_MINT_SECRET}" \
              -H 'Content-Type: application/json' \
              -d "{\"repositories\":[\"${repo_name}\"]}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          elif [ -n "$DOCS_BOT_TOKEN" ]; then
            BOT_TOKEN="$DOCS_BOT_TOKEN"
          else
            echo "::notice::no token source (token_broker_url+TOKEN_MINT_SECRET or DOCS_BOT_TOKEN) — skipping docs update"
            exit 0
          fi
          git clone --quiet --depth 1 \
            "https://x-access-token:${BOT_TOKEN}@github.com/${DOCS_REPO}.git" docs
          specs=()
          while IFS= read -r line; do
            [ -n "$line" ] && specs+=("$line")
          done <<< "$DOCS_OUTPUTS"
          # render-loc-mdx.py wants locale=path pairs; resolve them
          # against the docs checkout.
          render_specs=()
          for spec in "${specs[@]}"; do
            render_specs+=("${spec%%=*}=docs/${spec#*=}")
          done
          python3 "$CYPERA_DIR/tools/loc/render-loc-mdx.py" loc-results/org.json "${render_specs[@]}"
          cd docs
          git config user.name "cypera-loc-bot"
          git config user.email "cypera-loc-bot@users.noreply.github.com"
          git checkout -b "$DOCS_BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "Docs already up to date"
            exit 0
          fi
          git commit -m "docs: refresh codebase metrics"
          # --force-with-lease can't work here: the shallow single-branch
          # clone's fetch refspec doesn't cover $DOCS_BRANCH, so git has
          # no configured remote-tracking ref to lease against ("stale
          # info" even right after fetching). The branch is bot-owned and
          # regenerated wholesale — plain --force is correct.
          git push --force origin "$DOCS_BRANCH"
          export GH_TOKEN="$BOT_TOKEN"
          if ! gh pr list --repo "$DOCS_REPO" --head "$DOCS_BRANCH" --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr create --repo "$DOCS_REPO" --base "$PR_BASE" --head "$DOCS_BRANCH" \
              --title "docs: refresh codebase metrics" \
              --body "Auto-generated by the \`loc-org\` reusable workflow (9aia/cypera). Review the numbers, not the prose."
          fi
