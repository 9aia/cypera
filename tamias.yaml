# cypera — the 9aia toolbox, as a tamias pack.
#
# `tamias install git:9aia/cypera#<tag>` drops the whole toolbox
# (tools/, reusable workflows, agent docs) into the local store as a
# `files` pack — invoke scripts from the store payload path. CI uses
# the same channel: the loc-org/loc-repo reusable workflows install
# this pack via tamias and run tools/loc/* from the payload dir.
name: cypera-toolbox
version: "0.2.0"
type: files
description: >-
  9aia toolbox — loc (tokei lines-of-code counting + MDX metrics
  renderer), reusable GitHub Actions workflows, and agent-facing
  reference docs. Shipped as a files pack; installable from a git ref
  (`git:9aia/cypera#<semver-tag>`) for both local use and CI; no bins
  (the tools are scripts run from the payload).
